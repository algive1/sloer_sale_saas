services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saleor}
      POSTGRES_USER: ${POSTGRES_USER:-saleor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - saleor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saleor} -d ${POSTGRES_DB:-saleor}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  cache:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    volumes:
      - saleor-cache:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [backend]

  migrate:
    build:
      context: ./backend
    command: python3 manage.py migrate --noinput
    environment: &saleor-env
      DATABASE_URL: postgres://${POSTGRES_USER:-saleor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-saleor}
      CACHE_URL: redis://cache:6379/0
      CELERY_BROKER_URL: redis://cache:6379/1
      SECRET_KEY: ${SALEOR_SECRET_KEY:?set SALEOR_SECRET_KEY in .env}
      DEFAULT_CHANNEL_SLUG: ${SALEOR_DEFAULT_CHANNEL:-us}
      DEFAULT_FROM_EMAIL: ${SALEOR_DEFAULT_FROM_EMAIL:-noreply@example.com}
      EMAIL_URL: ${SALEOR_EMAIL_URL:-smtp://mailpit:1025}
      DASHBOARD_URL: ${SALEOR_DASHBOARD_URL:-http://localhost:9000/}
      ALLOWED_HOSTS: ${SALEOR_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      HTTP_IP_FILTER_ENABLED: ${SALEOR_HTTP_IP_FILTER_ENABLED:-False}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *saleor-env
    ports:
      - "8000:8000"
    volumes:
      - saleor-media:/app/media
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [backend]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    environment: *saleor-env
    volumes:
      - saleor-media:/app/media
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [backend]

  dashboard:
    build:
      context: ./dashboard
      args:
        API_URL: ${DASHBOARD_API_URL:-http://localhost:8000/graphql/}
        APP_MOUNT_URI: ${DASHBOARD_MOUNT_URI:-/}
        STATIC_URL: ${DASHBOARD_STATIC_URL:-/}
        SKIP_SOURCEMAPS: "true"
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      - api
    networks: [backend]

  storefront:
    build:
      context: ./storefront
      # The production deploy script starts API first. Host networking lets
      # Next.js server-side build fetches reach the published API port without
      # baking an internal Docker hostname into browser-facing NEXT_PUBLIC vars.
      network: host
      entitlements:
        - network.host
      args:
        SALEOR_INTERNAL_API_URL: ${SALEOR_BUILD_API_URL:-http://127.0.0.1:8000/graphql/}
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL:-http://localhost:8000/graphql/}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-http://localhost:3000}
        NEXT_PUBLIC_CHECKOUT_URL: ${NEXT_PUBLIC_CHECKOUT_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_CHANNEL: ${NEXT_PUBLIC_DEFAULT_CHANNEL:-us}
        NEXT_PUBLIC_ENABLE_STRIPE_PAYMENTS: ${NEXT_PUBLIC_ENABLE_STRIPE_PAYMENTS:-false}
        NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: ${NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT:-true}
    restart: unless-stopped
    environment:
      SALEOR_INTERNAL_API_URL: http://api:8000/graphql/
      NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL:-http://localhost:8000/graphql/}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-http://localhost:3000}
      NEXT_PUBLIC_CHECKOUT_URL: ${NEXT_PUBLIC_CHECKOUT_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_CHANNEL: ${NEXT_PUBLIC_DEFAULT_CHANNEL:-us}
      STOREFRONT_CHANNELS: ${STOREFRONT_CHANNELS:-us}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
      NEXT_PUBLIC_STOREFRONT_LOCALES: ${NEXT_PUBLIC_STOREFRONT_LOCALES:-en}
      NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS: ${NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS:-en:us}
      CONTENT_PROVIDER: ${CONTENT_PROVIDER:-saleor}
      ALLOW_DUMMY_PAYMENT: ${ALLOW_DUMMY_PAYMENT:-true}
      NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: ${NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT:-true}
      ENABLE_STRIPE_PAYMENTS: ${ENABLE_STRIPE_PAYMENTS:-false}
      # Server-only settings must be explicitly mapped into the running container.
      SALEOR_APP_TOKEN: ${SALEOR_APP_TOKEN:-}
      SALEOR_DASHBOARD_URL: ${SALEOR_DASHBOARD_URL:-http://localhost:9000/}
      ANALYTICS_LIBSQL_URL: ${ANALYTICS_LIBSQL_URL:-}
      ANALYTICS_LIBSQL_AUTH_TOKEN: ${ANALYTICS_LIBSQL_AUTH_TOKEN:-}
      ANALYTICS_DASHBOARD_SECRET: ${ANALYTICS_DASHBOARD_SECRET:-}
      THEME_LIBSQL_URL: ${THEME_LIBSQL_URL:-}
      THEME_LIBSQL_AUTH_TOKEN: ${THEME_LIBSQL_AUTH_TOKEN:-}
      STOREFRONT_SITE_ID: ${STOREFRONT_SITE_ID:-primary}
      STOREFRONT_SITES_JSON: ${STOREFRONT_SITES_JSON:-}
      STOREFRONT_PRIVACY_PAGE_SLUG: ${STOREFRONT_PRIVACY_PAGE_SLUG:-}
      STOREFRONT_TERMS_PAGE_SLUG: ${STOREFRONT_TERMS_PAGE_SLUG:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYMENT_REMINDER_FROM: ${PAYMENT_REMINDER_FROM:-}
      PAYMENT_REMINDER_CRON_SECRET: ${PAYMENT_REMINDER_CRON_SECRET:-}
      # Optional Chatwoot CE website chat and AI bot; never build into browser env.
      SUPPORT_CHATWOOT_BASE_URL: ${SUPPORT_CHATWOOT_BASE_URL:-}
      SUPPORT_CHATWOOT_SITES_JSON: ${SUPPORT_CHATWOOT_SITES_JSON:-}
      SUPPORT_AI_BOTS_JSON: ${SUPPORT_AI_BOTS_JSON:-}
      SUPPORT_AI_FAQS_JSON: ${SUPPORT_AI_FAQS_JSON:-}
      SUPPORT_AI_MODEL_URL: ${SUPPORT_AI_MODEL_URL:-}
      SUPPORT_AI_MODEL_NAME: ${SUPPORT_AI_MODEL_NAME:-}
      SUPPORT_AI_MODEL_API_KEY: ${SUPPORT_AI_MODEL_API_KEY:-}
      SUPPORT_AI_WORKER_SECRET: ${SUPPORT_AI_WORKER_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [backend]

  # Opt-in only; Chatwoot CE itself is deployed separately.
  support-ai-poller:
    image: curlimages/curl:8.15.0
    profiles: ["support-ai"]
    restart: unless-stopped
    environment:
      SUPPORT_AI_WORKER_SECRET: ${SUPPORT_AI_WORKER_SECRET:-}
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      test -n "${SUPPORT_AI_WORKER_SECRET}" || { echo "Missing AI worker secret" >&2; exit 1; };
      while :; do
        curl --fail --silent --show-error --max-time 30
          --header "Authorization: Bearer ${SUPPORT_AI_WORKER_SECRET}"
          --request POST
          http://storefront:3000/api/plugins/customer-support/agent-bot-worker || true;
        sleep 5;
      done
    depends_on:
      - storefront
    networks: [backend]

volumes:
  saleor-db:
  saleor-cache:
  saleor-media:

networks:
  backend:
    driver: bridge
