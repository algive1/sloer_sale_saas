# index.html points at hashed bundles that change with every image. Without an explicit
# policy, browsers cache it heuristically (from Last-Modified, which is the image build
# time) and keep booting the previous release's bundle after an image upgrade.
map $sent_http_content_type $cache_control {
    ~^text/html  "no-cache";
}

server {
    listen       80;
    server_name  localhost;
    root   /app/dashboard/;

    add_header Referrer-Policy origin-when-cross-origin;
    add_header Cache-Control $cache_control;

    # Clickjacking and MIME-sniffing protections for the staff admin surface.
    # `always` is required: without it nginx drops these headers on 4xx/5xx responses.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # script-src stays open because index.html carries an inline bootstrap that
    # nginx cannot sign at container start. Tighten only after that config is
    # externalized into a served file.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Commerce Ops runs in the same browser origin as Dashboard so its
    # HttpOnly Saleor session cookie and same-origin API requests stay scoped
    # to :9000. Keep this upstream private inside the Compose network.
    location = /ops {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /ops/ {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /commerce-admin/ {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /commerce-admin {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /api/manifest {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /api/admin-sso/ {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # /ops pages use both nested /ops APIs and a few root Next endpoints.
    # Next's build assets are also required by the iframe document.
    location ^~ /_next/ {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ^~ /api/ops/ {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    location /dashboard/ {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
