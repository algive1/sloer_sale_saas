# index.html points at hashed bundles that change with every image. Without an explicit
# policy, browsers cache it heuristically (from Last-Modified, which is the image build
# time) and keep booting the previous release's bundle after an image upgrade.
map $sent_http_content_type $cache_control {
    ~^text/html  "no-cache";
}

server {
    listen       80;
    server_name  localhost;
    root   /app/dashboard/;

    add_header Referrer-Policy origin-when-cross-origin;
    add_header Cache-Control $cache_control;

    # Clickjacking and MIME-sniffing protections for the staff admin surface.
    # `always` is required: without it nginx drops these headers on 4xx/5xx responses.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # script-src stays open because index.html carries an inline bootstrap that
    # nginx cannot sign at container start. Tighten only after that config is
    # externalized into a served file.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    location /dashboard/ {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
