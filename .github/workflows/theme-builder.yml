name: System storefront plugins

on:
  pull_request:
    paths:
      - "storefront/src/config/brand-sites*"
      - "storefront/src/lib/wishlist/**"
      - "storefront/src/checkout/lib/server/require-checkout-site*"
      - "storefront/src/lib/brand/**"
      - "storefront/src/plugins/theme-builder/**"
      - "storefront/src/plugins/system/**"
      - "storefront/src/plugins/analytics/**"
      - "storefront/src/plugins/ads-tracking/**"
      - "storefront/src/lib/analytics/ad-platforms.ts"
      - "storefront/src/lib/analytics/ga4.ts"
      - "storefront/src/lib/analytics/browser-ads.ts"
      - "storefront/src/lib/analytics/destinations/server-ads.ts"
      - "storefront/src/ui/components/ad-pixels.tsx"
      - "storefront/src/ui/components/analytics-mount.tsx"
      - "storefront/src/app/api/analytics/**"
      - "storefront/src/lib/analytics/first-party-store.ts"
      - "storefront/src/lib/analytics/*-report.ts"
      - "storefront/src/lib/analytics/overview-details.ts"
      - "storefront/src/app/ops/plugins/**"
      - "storefront/src/app/ops/analytics/analytics-nav.tsx"
      - "storefront/e2e/theme-builder-live.spec.ts"
      - "storefront/src/plugins/payment-reminders/**"
      - "storefront/src/lib/storage/**"
      - "storefront/src/lib/analytics/libsql-http.ts"
      - "storefront/src/app/ops/api/analytics/reminders/**"
      - "storefront/src/app/ops/analytics/reminders/**"
      - "docker-compose.yml"
      - ".env.example"
      - "storefront/src/app/ops/themes/**"
      - "storefront/src/app/(storefront)/**/page.tsx"
      - "storefront/package.json"
      - "storefront/pnpm-lock.yaml"
      - ".github/workflows/theme-builder.yml"
  push:
    branches:
      - main
    paths:
      - "storefront/src/config/brand-sites*"
      - "storefront/src/lib/wishlist/**"
      - "storefront/src/checkout/lib/server/require-checkout-site*"
      - "storefront/src/lib/brand/**"
      - "storefront/src/plugins/theme-builder/**"
      - "storefront/src/plugins/system/**"
      - "storefront/src/plugins/analytics/**"
      - "storefront/src/plugins/ads-tracking/**"
      - "storefront/src/lib/analytics/ad-platforms.ts"
      - "storefront/src/lib/analytics/ga4.ts"
      - "storefront/src/lib/analytics/browser-ads.ts"
      - "storefront/src/lib/analytics/destinations/server-ads.ts"
      - "storefront/src/ui/components/ad-pixels.tsx"
      - "storefront/src/ui/components/analytics-mount.tsx"
      - "storefront/src/app/api/analytics/**"
      - "storefront/src/lib/analytics/first-party-store.ts"
      - "storefront/src/lib/analytics/*-report.ts"
      - "storefront/src/lib/analytics/overview-details.ts"
      - "storefront/src/app/ops/plugins/**"
      - "storefront/src/app/ops/analytics/analytics-nav.tsx"
      - "storefront/e2e/theme-builder-live.spec.ts"
      - "storefront/src/plugins/payment-reminders/**"
      - "storefront/src/lib/storage/**"
      - "storefront/src/lib/analytics/libsql-http.ts"
      - "storefront/src/app/ops/api/analytics/reminders/**"
      - "storefront/src/app/ops/analytics/reminders/**"
      - "docker-compose.yml"
      - ".env.example"
      - "storefront/src/app/ops/themes/**"
      - "storefront/src/app/(storefront)/**/page.tsx"
      - "storefront/package.json"
      - "storefront/pnpm-lock.yaml"
      - ".github/workflows/theme-builder.yml"

permissions:
  contents: read

jobs:
  editor-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      NEXT_PUBLIC_SALEOR_API_URL: https://storefront1.saleor.cloud/graphql/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: storefront/.nvmrc
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm --dir storefront install --frozen-lockfile
      - name: Generate GraphQL types
        run: pnpm --dir storefront generate:all
      - name: TypeScript check
        run: pnpm --dir storefront exec tsc --noEmit
      - name: Reject old theme module import paths
        shell: bash
        run: |
          if git grep -n -E 'src/lib/theme-builder|@/lib/theme-builder' -- storefront/src storefront/e2e storefront/scripts; then
            echo "Legacy theme-builder imports must use src/plugins/theme-builder."
            exit 1
          fi

      - name: Theme builder tests
        run: pnpm --dir storefront exec vitest run src/config/brand-sites.test.ts src/config/locale-channel.test.ts src/lib/wishlist/site-scope.test.ts src/checkout/lib/server/require-checkout-site.test.ts src/plugins/theme-builder/validate.test.ts src/plugins/theme-builder/store.test.ts src/plugins/theme-builder/entry.server.test.ts src/plugins/system/registry.test.ts src/plugins/payment-reminders/service.test.ts src/plugins/payment-reminders/policy.test.ts src/plugins/analytics/scoped-statements.test.ts src/plugins/analytics/advanced-scoping.test.ts src/plugins/analytics/channel-scope.test.ts src/plugins/analytics/first-party-store.scope.test.ts src/plugins/analytics/compatibility.test.ts src/plugins/ads-tracking/config.test.ts src/plugins/ads-tracking/ga4-config.test.ts src/app/api/analytics/events/route.test.ts
