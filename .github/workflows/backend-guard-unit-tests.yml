name: Backend guard unit tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-guard-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-guard-unit-tests.yml"

permissions:
  contents: read

jobs:
  shared-core-guest-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # saleor/graphql/conftest.py warms the site cache through Site.objects.get_current()
      # in an autouse fixture, and the guard's staff/app/customer fixtures are declared
      # against `db`, so every test in this tree needs a real PostgreSQL. The image matches
      # docker-compose.yml so CI exercises the same major version the stack deploys.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: saleor
          POSTGRES_PASSWORD: saleor
          POSTGRES_DB: saleor
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U saleor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SECRET_KEY: ci-backend-unit-secret-key-not-for-production
      DATABASE_URL: postgres://saleor:saleor@127.0.0.1:5432/saleor
      # Locmem cache keeps this job free of a Redis/Valkey service; setup.cfg's
      # --allow-hosts cache only permits one, it does not require it.
      CACHE_URL: locmem://

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          cache-dependency-path: backend/uv.lock

      - name: Install pinned backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Shared-core guest guard blocks checkout metadata without the gateway secret
        working-directory: backend
        # -n0 keeps one pytest-django test database instead of building one per xdist
        # worker; this suite is 19 hermetic resolver tests, so parallelism only buys
        # migration time.
        run: >-
          uv run --frozen pytest
          saleor/graphql/tests/test_shared_core_guest_guard.py
          -n0 -q --no-cov -p no:cacheprovider
