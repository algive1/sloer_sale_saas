name: Theme builder lockfile sync (temporary)

on:
  push:
    branches:
      - feat/theme-builder-fashion-puck
    paths:
      - ".github/workflows/theme-builder-lock-sync.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate canonical pnpm lockfile
        env:
          HUSKY: "0"
        run: |
          pnpm --dir storefront install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm --dir storefront install --frozen-lockfile --lockfile-only --ignore-scripts
      - name: Commit dependency lockfile
        run: |
          if git diff --quiet -- storefront/pnpm-lock.yaml; then
            echo "Lockfile already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storefront/pnpm-lock.yaml
          git commit -m "chore(storefront): sync Puck pnpm lockfile"
          git push origin HEAD:feat/theme-builder-fashion-puck
