name: Commerce configuration

on:
  pull_request:
    paths:
      - "config/saleor/**"
      - "package.json"
      - ".github/workflows/commerce-config.yml"
  push:
    branches:
      - main
    paths:
      - "config/saleor/**"
      - "package.json"
      - ".github/workflows/commerce-config.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Saleor 3.23 commerce configuration
        run: pnpm config:validate
