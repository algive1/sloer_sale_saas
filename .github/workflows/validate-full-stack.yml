name: Validate full-stack self-hosting

on:
  push:
    branches:
      - chore/full-stack-selfhost
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - "backend/**"
      - "dashboard/**"
      - "storefront/**"
      - "scripts/**"
      - ".github/workflows/validate-full-stack.yml"
  pull_request:
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - "backend/**"
      - "dashboard/**"
      - "storefront/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored sources
        run: |
          test -f backend/manage.py
          test -f backend/Dockerfile
          test -f dashboard/package.json
          test -f dashboard/Dockerfile
          test "$(cat backend/.upstream-sha)" = "ee79049fd27d8091ab897ea3ed8145df0b3c9ae7"
          test "$(cat dashboard/.upstream-sha)" = "bc75e988da0fa4fbc3d47378a888d859d070746f"
          node -e 'const p=require("./dashboard/package.json"); if (p.version !== "3.23.39") process.exit(1)'

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          SALEOR_ALLOWED_CLIENT_HOSTS=www.example.com \
          SALEOR_PUBLIC_URL=https://api.example.com/ \
          SALEOR_RSA_PRIVATE_KEY=ci-placeholder-private-key \
          SALEOR_EMAIL_URL=smtp://user:password@smtp.example.com:587/?tls=True \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap-local.sh
          bash -n scripts/deploy.sh
          bash -n scripts/vendor-upstreams.sh
