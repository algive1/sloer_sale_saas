name: Paper source

on:
  pull_request:
    paths:
      - "storefront/**"
      - "scripts/verify-paper-pin.sh"
      - ".github/workflows/paper-source.yml"
  push:
    branches:
      - main
    paths:
      - "storefront/**"
      - "scripts/verify-paper-pin.sh"
      - ".github/workflows/paper-source.yml"

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: storefront/.nvmrc
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml

      - name: Verify Paper pin
        run: bash scripts/verify-paper-pin.sh

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: pnpm --dir storefront install --frozen-lockfile

      - name: Check Paper docs
        run: pnpm --dir storefront docs:check

      - name: Check design tokens
        run: pnpm --dir storefront lint:design-tokens

      - name: Check Variant GraphQL rules
        run: pnpm --dir storefront lint:graphql-variants

      - name: Verify locale coverage audit
        run: |
          pnpm --dir storefront locales:test
          pnpm --dir storefront locales:check

      - name: Verify AI translation draft safety
        run: pnpm --dir storefront translations:ai:test

      - name: ESLint source check
        env:
          # Same public Saleor schema endpoint used by upstream Paper lint CI.
          NEXT_PUBLIC_SALEOR_API_URL: https://storefront1.saleor.cloud/graphql/
        run: pnpm --dir storefront exec eslint .

      # Full typecheck intentionally belongs to integration CI.
      # Paper generates src/gql/* from the live Saleor GraphQL schema before typecheck.
