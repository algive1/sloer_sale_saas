name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed environment secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(\.example|\.template); then
            echo "Tracked environment files detected. Commit only documented *.example / *.template environment templates."
            exit 1
          fi

      - name: Verify project baseline
        shell: bash
        run: |
          test -f docs/architecture.md
          test -f docs/product-model.md
          test -f docs/phase-1.md
          test -f docs/upstream.md
          test -f storefront/package.json
          test -f storefront/.paper-upstream-sha
          test -f storefront/.env.project.example
          test -f infra/local/saleor.override.yml

      - name: Verify pinned Paper source
        run: bash scripts/verify-paper-pin.sh
; then
            echo "Tracked environment files detected. Commit only documented *.example / *.template environment templates."
            exit 1
          fi

      - name: Verify project baseline
        shell: bash
        run: |
          test -f docs/architecture.md
          test -f docs/product-model.md
          test -f docs/phase-1.md
          test -f docs/upstream.md
          test -f storefront/package.json
          test -f storefront/.paper-upstream-sha
          test -f storefront/.env.project.example
          test -f infra/local/saleor.override.yml

      - name: Verify pinned Paper source
        run: bash scripts/verify-paper-pin.sh
