name: Theme builder type verification (temporary)

on:
  push:
    branches:
      - feat/theme-builder-fashion-puck
    paths:
      - ".github/workflows/theme-builder-verify-temporary.yml"

permissions:
  contents: read

jobs:
  verify-theme-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      NEXT_PUBLIC_SALEOR_API_URL: https://storefront1.saleor.cloud/graphql/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: storefront/.nvmrc
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm --dir storefront install --frozen-lockfile
      - name: Generate GraphQL artifacts
        run: pnpm --dir storefront generate:all
      - name: TypeScript verify
        run: pnpm --dir storefront exec tsc --noEmit
      - name: Theme builder unit tests
        run: pnpm --dir storefront exec vitest run src/lib/theme-builder/validate.test.ts
