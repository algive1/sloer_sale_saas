name: Saleor 3.23.38 integration

on:
  pull_request:
    paths:
      - "storefront/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/saleor-integration.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "storefront/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/saleor-integration.yml"
      - "package.json"

concurrency:
  group: saleor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-against-pinned-saleor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SALEOR_PLATFORM_SHA: ab6315bd59c58b4815175df4c679107ff9695be4
      SALEOR_APPS_SHA: 3601e299162023d151f8087d2334f7da1f420955
      SALEOR_API_URL: http://localhost:8000/graphql/
      NEXT_PUBLIC_SALEOR_API_URL: http://localhost:8000/graphql/
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml

      - name: Checkout pinned Saleor platform
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/saleor/saleor-platform.git /tmp/saleor-platform
          git -C /tmp/saleor-platform fetch --depth 1 origin "$SALEOR_PLATFORM_SHA"
          git -C /tmp/saleor-platform checkout --detach FETCH_HEAD
          test "$(git -C /tmp/saleor-platform rev-parse HEAD)" = "$SALEOR_PLATFORM_SHA"

      - name: Checkout pinned official Saleor apps
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/saleor/apps.git /tmp/saleor-apps
          git -C /tmp/saleor-apps fetch --depth 1 origin "$SALEOR_APPS_SHA"
          git -C /tmp/saleor-apps checkout --detach FETCH_HEAD
          test "$(git -C /tmp/saleor-apps rev-parse HEAD)" = "$SALEOR_APPS_SHA"

      - name: Migrate Saleor 3.23.38 database
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            run --rm api python3 manage.py migrate --noinput

      - name: Seed integration catalog
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            run --rm api python3 manage.py populatedb --createsuperuser

      - name: Bootstrap US / USD channel
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            run --rm api python3 manage.py shell < "$GITHUB_WORKSPACE/infra/saleor/bootstrap_us.py"

      - name: Start Saleor API
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            up -d db cache jaeger api worker

      - name: Wait for Saleor GraphQL
        run: bash scripts/wait-for-saleor.sh "$SALEOR_API_URL"

      - name: Install official Dummy Payment App dependencies
        run: pnpm --dir /tmp/saleor-apps install --frozen-lockfile --filter saleor-app-payment-dummy...

      - name: Start official Dummy Payment App
        shell: bash
        env:
          APL: file
          FILE_APL_PATH: /tmp/dummy-payment-auth.json
          APP_API_BASE_URL: http://host.docker.internal:3000
          APP_IFRAME_BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          nohup pnpm --dir /tmp/saleor-apps --filter saleor-app-payment-dummy exec next dev \
            -H 0.0.0.0 -p 3000 > /tmp/dummy-payment.log 2>&1 &
          echo "$!" > /tmp/dummy-payment.pid

          for attempt in $(seq 1 90); do
            if curl -fsS \
              -H 'Saleor-Schema-Version: 3.23' \
              http://localhost:3000/api/manifest > /tmp/dummy-payment-manifest.json; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat /tmp/dummy-payment.log
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/dummy-payment-manifest.json").read_text())
          assert manifest["id"] == "saleor.io.dummy-payment-app", manifest
          print({"app": manifest["name"], "id": manifest["id"], "version": manifest["version"]})
          PY

      - name: Install Dummy Payment App into Saleor
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            exec -T api python3 manage.py install_app \
            http://host.docker.internal:3000/api/manifest \
            --activate --quiet

      - name: Verify official payment app installation
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            exec -T api python3 manage.py shell -c \
            'from saleor.app.models import App; a=App.objects.get(identifier="saleor.io.dummy-payment-app"); assert a.is_active; assert a.is_installed; assert a.webhooks.filter(is_active=True).count() >= 3; print({"identifier": a.identifier, "active": a.is_active, "installed": a.is_installed, "webhooks": a.webhooks.filter(is_active=True).count()})'

      - name: Verify US channel configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            exec -T api python3 manage.py shell -c \
            'from saleor.channel.models import Channel; c=Channel.objects.get(slug="us"); assert c.currency_code == "USD"; assert c.is_active; assert str(c.default_country) == "US"; print({"slug": c.slug, "currency": c.currency_code, "active": c.is_active, "country": str(c.default_country)})'

      - name: Verify anonymous US catalog GraphQL
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H 'content-type: application/json' \
            --data '{"query":"{ products(first: 1, channel: \"us\") { totalCount edges { node { id slug } } } }"}' \
            "$SALEOR_API_URL" | tee /tmp/us-catalog.json
          ! grep -q '"errors"' /tmp/us-catalog.json
          grep -q '"totalCount":' /tmp/us-catalog.json

      - name: Create paid US order through Transactions API
        run: node scripts/checkout-transactions-smoke.mjs

      - name: Install Paper dependencies
        run: pnpm --dir storefront install --frozen-lockfile

      - name: Generate GraphQL types from Saleor 3.23.38
        run: pnpm --dir storefront generate:all

      - name: TypeScript check
        run: pnpm --dir storefront exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir storefront test:run

      - name: Build US storefront
        env:
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3100
          NEXT_PUBLIC_DEFAULT_CHANNEL: us
          STOREFRONT_CHANNELS: us
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_STOREFRONT_LOCALES: en
          NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS: en:us
          CONTENT_PROVIDER: saleor
          ALLOW_DUMMY_PAYMENT: "true"
          NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: "true"
        run: pnpm --dir storefront build

      - name: Verify sitemap and Google Merchant feed
        shell: bash
        env:
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3100
          NEXT_PUBLIC_DEFAULT_CHANNEL: us
          STOREFRONT_CHANNELS: us
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_STOREFRONT_LOCALES: en
          NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS: en:us
          CONTENT_PROVIDER: saleor
          GOOGLE_MERCHANT_FEED_ENABLED: "true"
        run: |
          set -euo pipefail
          nohup pnpm --dir storefront exec next start -p 3100 > /tmp/storefront.log 2>&1 &
          echo "$!" > /tmp/storefront.pid

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3100/robots.txt > /tmp/robots.txt; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/storefront.log
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:3100/sitemap.xml | tee /tmp/sitemap.xml
          grep -q 'http://localhost:3100/en/us/products/' /tmp/sitemap.xml
          grep -q 'http://localhost:3100/sitemap.xml' /tmp/robots.txt

          curl -fsS 'http://localhost:3100/merchant/google.xml?channel=us&locale=en' \
            | tee /tmp/google-merchant.xml
          grep -q '<rss xmlns:g="http://base.google.com/ns/1.0"' /tmp/google-merchant.xml
          grep -q '<g:item_group_id>' /tmp/google-merchant.xml
          grep -q '<g:price>.* USD</g:price>' /tmp/google-merchant.xml
          grep -q '<g:availability>' /tmp/google-merchant.xml

      - name: Integration logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/storefront.log ]; then
            echo "===== Paper Storefront ====="
            tail -n 300 /tmp/storefront.log || true
          fi
          if [ -f /tmp/dummy-payment.log ]; then
            echo "===== Dummy Payment App ====="
            tail -n 300 /tmp/dummy-payment.log || true
          fi
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            ps || true
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            logs --tail=300 api worker db cache || true

      - name: Stop integration services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/storefront.pid ]; then
            kill "$(cat /tmp/storefront.pid)" || true
          fi
          if [ -f /tmp/dummy-payment.pid ]; then
            kill "$(cat /tmp/dummy-payment.pid)" || true
          fi
          docker compose \
            --project-directory /tmp/saleor-platform \
            -f /tmp/saleor-platform/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/infra/local/saleor.override.yml" \
            down -v || true
