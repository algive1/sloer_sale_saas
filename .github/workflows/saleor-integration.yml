name: Saleor 3.23.40 source integration

on:
  pull_request:
    paths:
      - "backend/**"
      - "dashboard/**"
      - "storefront/**"
      - "infra/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/saleor-integration.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "dashboard/**"
      - "storefront/**"
      - "infra/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/saleor-integration.yml"
      - "package.json"

concurrency:
  group: saleor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-against-vendored-saleor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SALEOR_APPS_SHA: 3601e299162023d151f8087d2334f7da1f420955
      SALEOR_API_URL: http://127.0.0.1:8000/graphql/
      SALEOR_BUILD_API_URL: http://127.0.0.1:8000/graphql/
      NEXT_PUBLIC_SALEOR_API_URL: http://127.0.0.1:8000/graphql/
      POSTGRES_DB: saleor
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: ci-saleor-password
      SALEOR_SECRET_KEY: ci-saleor-secret-key-at-least-32-characters-long
      SALEOR_ALLOWED_HOSTS: localhost,127.0.0.1,api
      SALEOR_DEFAULT_CHANNEL: us
      SALEOR_DASHBOARD_URL: http://localhost:9000/
      DASHBOARD_API_URL: http://127.0.0.1:8000/graphql/
      DASHBOARD_MOUNT_URI: /
      DASHBOARD_STATIC_URL: /
      ORDER_VIEW_SECRET: ci-order-view-secret-at-least-32-characters
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml

      - name: Verify vendored release pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat backend/.upstream-sha)" = "ee79049fd27d8091ab897ea3ed8145df0b3c9ae7"
          test "$(cat dashboard/.upstream-sha)" = "bc75e988da0fa4fbc3d47378a888d859d070746f"
          grep -q 'version = "3.23.40"' backend/pyproject.toml
          grep -q 'django\[bcrypt\]~=5.2.18' backend/pyproject.toml
          node -e 'const p=require("./dashboard/package.json"); if (p.version !== "3.23.39") process.exit(1)'

      - name: Create CI Compose overlay
        shell: bash
        run: |
          cat > /tmp/ci-compose.yml <<'YAML'
          services:
            api:
              extra_hosts:
                - "host.docker.internal:host-gateway"
            worker:
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YAML

      - name: Build vendored Saleor backend
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml build api worker migrate

      - name: Start PostgreSQL, Valkey and Mailpit
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml up -d db cache mailpit

      - name: Migrate Saleor 3.23.40 database
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml run --rm migrate
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml run --rm -T api             python3 manage.py showmigrations product | tee /tmp/product-migrations.txt
          grep -q '\[X\] 0209_collection_external_reference' /tmp/product-migrations.txt
          grep -q '\[X\] 0210_collection_external_reference_unique_constraint' /tmp/product-migrations.txt

      - name: Seed integration catalog
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml run --rm api             python3 manage.py populatedb --createsuperuser

      - name: Bootstrap US / USD channel
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml run --rm -T api             python3 manage.py shell < infra/saleor/bootstrap_us.py

      - name: Seed published featured collection for theme builder E2E
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml run --rm -T api \
            python3 manage.py shell < infra/saleor/bootstrap_theme_collection.py

      - name: Start vendored Saleor API and worker
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml up -d api worker

      - name: Wait for Saleor GraphQL
        run: bash scripts/wait-for-saleor.sh "$SALEOR_API_URL"

      - name: Checkout pinned official Saleor apps
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/saleor/apps.git /tmp/saleor-apps
          git -C /tmp/saleor-apps fetch --depth 1 origin "$SALEOR_APPS_SHA"
          git -C /tmp/saleor-apps checkout --detach FETCH_HEAD
          test "$(git -C /tmp/saleor-apps rev-parse HEAD)" = "$SALEOR_APPS_SHA"

      - name: Install official Dummy Payment App dependencies
        run: pnpm --dir /tmp/saleor-apps install --frozen-lockfile --filter saleor-app-payment-dummy...

      - name: Start official Dummy Payment App
        shell: bash
        env:
          APL: file
          FILE_APL_PATH: /tmp/dummy-payment-auth.json
          APP_API_BASE_URL: http://host.docker.internal:3000
          APP_IFRAME_BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          nohup pnpm --dir /tmp/saleor-apps --filter saleor-app-payment-dummy exec next dev             -H 0.0.0.0 -p 3000 > /tmp/dummy-payment.log 2>&1 &
          echo "$!" > /tmp/dummy-payment.pid

          for attempt in $(seq 1 90); do
            if curl -fsS               -H 'Saleor-Schema-Version: 3.23'               http://localhost:3000/api/manifest > /tmp/dummy-payment-manifest.json; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat /tmp/dummy-payment.log
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/dummy-payment-manifest.json").read_text())
          assert manifest["id"] == "saleor.io.dummy-payment-app", manifest
          print({"app": manifest["name"], "id": manifest["id"], "version": manifest["version"]})
          PY

      - name: Install Dummy Payment App into vendored Saleor
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml exec -T api             python3 manage.py install_app             http://host.docker.internal:3000/api/manifest             --activate --quiet

      - name: Verify official payment app installation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml exec -T api             python3 manage.py shell -c             'from saleor.app.models import App; a=App.objects.get(identifier="saleor.io.dummy-payment-app"); assert a.is_active; assert a.is_installed; assert a.webhooks.filter(is_active=True).count() >= 3; print({"identifier": a.identifier, "active": a.is_active, "installed": a.is_installed, "webhooks": a.webhooks.filter(is_active=True).count()})'

      - name: Verify US channel configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml exec -T api             python3 manage.py shell -c             'from saleor.channel.models import Channel; c=Channel.objects.get(slug="us"); assert c.currency_code == "USD"; assert c.is_active; assert str(c.default_country) == "US"; print({"slug": c.slug, "currency": c.currency_code, "active": c.is_active, "country": str(c.default_country)})'

      - name: Verify anonymous US catalog GraphQL
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST             -H 'content-type: application/json'             --data '{"query":"{ products(first: 1, channel: \"us\") { totalCount edges { node { id slug } } } }"}'             "$SALEOR_API_URL" | tee /tmp/us-catalog.json
          ! grep -q '"errors"' /tmp/us-catalog.json
          grep -q '"totalCount":' /tmp/us-catalog.json

      - name: Create paid US order through Transactions API
        run: node scripts/checkout-transactions-smoke.mjs

      - name: Install Paper dependencies
        run: pnpm --dir storefront install --frozen-lockfile

      - name: Generate GraphQL types from Saleor 3.23.40
        run: pnpm --dir storefront generate:all

      - name: TypeScript check
        run: pnpm --dir storefront exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir storefront test:run

      - name: Build self-hosted Dashboard and Storefront images
        shell: bash
        env:
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3100
          NEXT_PUBLIC_CHECKOUT_URL: http://localhost:3100
          NEXT_PUBLIC_DEFAULT_CHANNEL: us
          STOREFRONT_CHANNELS: us
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_STOREFRONT_LOCALES: en
          NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS: en:us
          CONTENT_PROVIDER: saleor
          ALLOW_DUMMY_PAYMENT: "true"
          NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: "true"
        run: |
          set -euo pipefail
          # Compose's implicit Bake invocation omits the required explicit network.host grant.
          # Pass only this declared entitlement so Next's build can reach the CI Saleor API.
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml build --print | docker buildx bake --allow=network.host -f - dashboard storefront

      - name: Start isolated theme libSQL (SQLite-backed Hrana) for editor E2E
        shell: bash
        env:
          CI_THEME_LIBSQL_TOKEN: ci-theme-secret-only-for-testing
        run: |
          set -euo pipefail
          nohup python3 scripts/mock-theme-hrana.py > /tmp/theme-hrana.log 2>&1 &
          echo "$!" > /tmp/theme-hrana.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3789/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/theme-hrana.log
              exit 1
            fi
            sleep 1
          done

      - name: Build US storefront
        env:
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3100
          NEXT_PUBLIC_CHECKOUT_URL: http://localhost:3100
          NEXT_PUBLIC_DEFAULT_CHANNEL: us
          STOREFRONT_CHANNELS: us
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_STOREFRONT_LOCALES: en
          NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS: en:us
          CONTENT_PROVIDER: saleor
          ALLOW_DUMMY_PAYMENT: "true"
          NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: "true"
          NEXT_PUBLIC_ANALYTICS_CONSENT_MODE: required
          NEXT_PUBLIC_META_PIXEL_ID: "123456789012345"
          NEXT_PUBLIC_TIKTOK_PIXEL_ID: "E2EPIXEL123"
          NEXT_PUBLIC_GOOGLE_ADS_ID: "AW-123456789"
          NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL: "E2E_TEST"
          THEME_LIBSQL_URL: http://127.0.0.1:3789
          THEME_LIBSQL_AUTH_TOKEN: ci-theme-secret-only-for-testing
          STOREFRONT_SITE_ID: fashion-ci
        run: pnpm --dir storefront build

      - name: Verify sitemap and Google Merchant feed
        shell: bash
        env:
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3100
          NEXT_PUBLIC_CHECKOUT_URL: http://localhost:3100
          NEXT_PUBLIC_DEFAULT_CHANNEL: us
          STOREFRONT_CHANNELS: us
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_STOREFRONT_LOCALES: en
          NEXT_PUBLIC_STOREFRONT_LOCALE_CHANNELS: en:us
          CONTENT_PROVIDER: saleor
          ALLOW_DUMMY_PAYMENT: "true"
          NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: "true"
          GOOGLE_MERCHANT_FEED_ENABLED: "true"
          NEXT_PUBLIC_ANALYTICS_CONSENT_MODE: required
          NEXT_PUBLIC_META_PIXEL_ID: "123456789012345"
          NEXT_PUBLIC_TIKTOK_PIXEL_ID: "E2EPIXEL123"
          NEXT_PUBLIC_GOOGLE_ADS_ID: "AW-123456789"
          NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL: "E2E_TEST"
          THEME_LIBSQL_URL: http://127.0.0.1:3789
          THEME_LIBSQL_AUTH_TOKEN: ci-theme-secret-only-for-testing
          STOREFRONT_SITE_ID: fashion-ci
          ANALYTICS_DASHBOARD_SECRET: ci-theme-editor-basic-password
        run: |
          set -euo pipefail
          nohup pnpm --dir storefront exec next start -p 3100 > /tmp/storefront.log 2>&1 &
          echo "$!" > /tmp/storefront.pid

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3100/robots.txt > /tmp/robots.txt; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/storefront.log
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:3100/sitemap.xml | tee /tmp/sitemap.xml
          grep -q 'http://localhost:3100/en/us/products/' /tmp/sitemap.xml
          grep -q 'http://localhost:3100/sitemap.xml' /tmp/robots.txt

          curl -fsS 'http://localhost:3100/merchant/google.xml?channel=us&locale=en'             | tee /tmp/google-merchant.xml
          grep -q '<rss xmlns:g="http://base.google.com/ns/1.0"' /tmp/google-merchant.xml
          grep -q '<g:item_group_id>' /tmp/google-merchant.xml
          grep -q '<g:price>.* USD</g:price>' /tmp/google-merchant.xml
          grep -q '<g:availability>' /tmp/google-merchant.xml

      - name: Install Chromium for browser commerce E2E
        run: pnpm --dir storefront exec playwright install --with-deps chromium

      - name: Browser commerce full-flow E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
        run: pnpm --dir storefront exec playwright test e2e/checkout-live.spec.ts --workers=1

      - name: Storefront theme editor draft and published homepage E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          PLAYWRIGHT_THEME_EDITOR_SECRET: ci-theme-editor-basic-password
          PLAYWRIGHT_THEME_DB_RESET_TOKEN: ci-theme-secret-only-for-testing
        run: pnpm --dir storefront exec playwright test e2e/theme-builder-live.spec.ts --workers=1

      - name: Integration logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/storefront.log ]; then
            echo "===== Paper Storefront ====="
            tail -n 300 /tmp/storefront.log || true
          fi
          if [ -f /tmp/dummy-payment.log ]; then
            echo "===== Dummy Payment App ====="
            tail -n 300 /tmp/dummy-payment.log || true
          fi
          if [ -f /tmp/theme-hrana.log ]; then
            echo "===== Theme Hrana CI ====="
            tail -n 120 /tmp/theme-hrana.log || true
          fi
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml ps || true
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml             logs --tail=300 api worker db cache || true

      - name: Stop integration services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/storefront.pid ]; then
            kill "$(cat /tmp/storefront.pid)" || true
          fi
          if [ -f /tmp/dummy-payment.pid ]; then
            kill "$(cat /tmp/dummy-payment.pid)" || true
          fi
          if [ -f /tmp/theme-hrana.pid ]; then
            kill "$(cat /tmp/theme-hrana.pid)" || true
          fi
          docker compose -f docker-compose.yml -f /tmp/ci-compose.yml down -v || true
