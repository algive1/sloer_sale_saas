query OpsCatalogPreflight($skus: [String!]!) {
  productVariants(first: 100, where: {sku: {oneOf: $skus}}) {
    pageInfo { hasNextPage }
    edges { node {
      sku
      channelListings {
        channel { slug currencyCode isActive }
        price { currency fractionDigits }
      }
      product { channelListings { channel { slug currencyCode isActive } } }
    } }
  }
}
