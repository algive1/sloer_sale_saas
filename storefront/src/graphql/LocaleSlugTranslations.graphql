	slugDA: translation(languageCode: DA) {
		slug
	}
	slugSV: translation(languageCode: SV) {
		slug
	}
	slugES: translation(languageCode: ES) {
		slug
	}
	slugIT: translation(languageCode: IT) {
		slug
	}
	slugPL: translation(languageCode: PL) {
		slug
	}
	slugPT: translation(languageCode: PT) {
		slug
	}
	slugCS: translation(languageCode: CS) {
		slug
	}
	slugJA: translation(languageCode: JA) {
		slug
	}
	slugFI: translation(languageCode: FI) {
		slug
	}
	slugNB: translation(languageCode: NB) {
		slug
	}
	slugKO: translation(languageCode: KO) {
